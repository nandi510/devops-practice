# AWS Load Balancer Controller Ingress
# Pre-requisites:
#   1. Install AWS Load Balancer Controller on EKS (see scripts/install-aws-lb-controller.sh)
#   2. Ensure your EKS worker nodes have proper IAM role for ALB
#   3. Tag subnets: kubernetes.io/role/elb=1 (public) or kubernetes.io/role/internal-elb=1 (private)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: devops-app
  annotations:
    # AWS ALB Controller annotations
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"          # or "internal"
    alb.ingress.kubernetes.io/target-type: "ip"                  # pod IP routing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'     # add HTTPS later
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # Optional: add SSL later
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/CERT_ID
spec:
  rules:
    - host: app.yourdomain.com      # <-- CHANGE or remove for ALB DNS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80
