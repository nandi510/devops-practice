# ⚠️  NOTE: This is a plain K8s Secret for practice only.
# TODO: Replace with AWS Secrets Manager + External Secrets Operator later.
#
# To generate base64 values:
#   echo -n 'yourvalue' | base64
#
# Current values (change before use):
#   DB_USER:     appuser      → YXBwdXNlcg==
#   DB_PASSWORD: apppassword  → YXBwcGFzc3dvcmQ=
#   DB_NAME:     appdb        → YXBwZGI=
#   MYSQL_ROOT_PASSWORD: rootpassword → cm9vdHBhc3N3b3Jk

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: devops-app
type: Opaque
data:
  DB_USER: YXBwdXNlcg==          # appuser
  DB_PASSWORD: YXBwcGFzc3dvcmQ=  # apppassword
  DB_NAME: YXBwZGI=               # appdb
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk  # rootpassword
